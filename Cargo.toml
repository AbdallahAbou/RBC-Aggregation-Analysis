[package]
name = "rbc-aggregation"
version = "0.1.0"
edition = "2021"
authors = ["Abdallah Abouabdallah <abdallah.abouabdallah@rwth-aachen.de>"]
description = "3D analysis pipeline for red blood cell aggregation from confocal microscopy data"
license = "MIT"
repository = "https://github.com/AbdallahAbou/RBC-Aggregation-Analysis"
keywords = ["biophysics", "microscopy", "mesh-processing", "scientific-computing"]
categories = ["science", "visualization"]

[dependencies]
nalgebra = "0.32"
ndarray = { version = "0.15", features = ["rayon"] }
rayon = "1.8"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
tiff = "0.9"
obj = "0.10"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = "0.3"
plotters = { version = "0.3", optional = true }

[dev-dependencies]
criterion = "0.5"
approx = "0.5"

[features]
default = []
visualization = ["plotters"]

[[bin]]
name = "rbc-analyze"
path = "src/main.rs"

[[example]]
name = "pair_correlation"
path = "examples/pair_correlation.rs"

[[bench]]
name = "mesh_processing"
harness = false

[profile.release]
lto = true
codegen-units = 1
