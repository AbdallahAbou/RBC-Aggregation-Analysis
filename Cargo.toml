[package]
name = "rbc-aggregation"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = "0.32"
ndarray = { version = "0.15", features = ["rayon"] }
rayon = "1.8"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
tiff = "0.9"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"
approx = "0.5"
rand = "0.8"

[[bench]]
name = "mesh_processing"
harness = false

[profile.release]
lto = true
authors = ["Abdallah Abouabdallah <abdallah.abouabdallah.bmt@gmail.com>"]
description = "3D analysis pipeline for red blood cell aggregation from confocal microscopy data"
license = "MIT"
keywords = ["biophysics", "microscopy", "mesh-processing", "scientific-computing"]
